# Xiaomi 15 (dada) -- Snapdragon 8 Elite (SM8750), the Milestone 5 arm64e-on-real-silicon target.
# Addresses come from the UniXNU-dada reconnaissance (github.com/7Night-kqx/UniXNU-dada,
# docs/known-values.md) and the stock device tree.
# The SM8750 Oryon cores have standard PAC (paca/pacg in /proc/cpuinfo), so the HAS_STD_PAC arm64e
# kernel's instructions run natively here.
NAME="Xiaomi 15 (dada)"
KIND=phone
SOC="Qualcomm Snapdragon 8 Elite (SM8750)"

# --- boot chain ------------------------------------------------------------------------------------
# Mu-Silicium boots dada to Stage 1 (framebuffer, menu, UFS, UART7); its UEFI starts our loader.
UEFI_TARGET=dada
UEFI_FD=                        # a built SILICIUM_UEFI.fd for dada (from the Mu-Silicium dadaPkg); empty until built
DTB=                           # dada's stock device tree (from vendor_boot; /sys/firmware/fdt needs root)
FD_BASE=0xA7100000             # MemoryMapLib UEFI_FD (known-values.md)
FD_SIZE=0x300000
PAYLOAD_BASE=0xA8000000        # MemoryMapLib "Kernel" reservation (0xA8000000, size 0x10000000 = 256 MB)
HEADER_VERSION=4               # dada's bootloader wants Android boot header v4 (dada.toml); v1's load
                               # base 0x10000000 is below dada's DRAM (0x80000000) -> loads to nowhere -> reset

# --- kernel and loader -----------------------------------------------------------------------------
FB_BASE=0xFC800000             # GOP framebuffer base (splash_region); xnuloader picks platform_dada by it
WIFI_ATH11K=0                  # SM8750 Wi-Fi is not the WCN6750/ath11k radio

# --- what the run needs ----------------------------------------------------------------------------
# Bring-up like QEMU milestone 4: one core, no extra subsystems.  Grows later (touchscreen=1, cpus=8,
# gpu=1, ...) once hello runs as PID 1 on the real core.
BOOTARGS="cpus=1"
DEFAULT_SECS=900
USERLAND_VARS=""
FIRMWARE=""
